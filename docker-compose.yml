version: '3.8'

services:
  app:
    build: 
      context: .
      args:
        - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    image: deepseek-customer-service
    container_name: deepseek-service
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - KNOWLEDGE_DIR=/app/knowledge_data
      # 新增数据库环境变量
      - DB_HOST=mysql
      - DB_USER=deepseek
      - DB_PASSWORD=deepseek_password
      - DB_NAME=deepseek_db
      - DB_PORT=3306
    volumes:
      - ./knowledge_data:/app/knowledge_data
      - ./app:/app/app
      - ./static:/app/static
      - ./migrations:/app/migrations  # 数据库迁移脚本
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy  # 新增MySQL依赖
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: deepseek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  # 新增MySQL服务
  mysql:
    image: mysql:8.0
    container_name: deepseek-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: deepseek_db
      MYSQL_USER: deepseek
      MYSQL_PASSWORD: deepseek_password
    ports:
      - "3307:3306"  # 外部访问端口
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d  # 初始化脚本
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: --default-authentication-plugin=mysql_native_password

volumes:
  redis-data:
  mysql-data:  # MySQL数据卷