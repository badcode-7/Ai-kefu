version: '3.8'

services:
  app:
    build: 
      context: .
      args:
        - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    image: deepseek-customer-service
    container_name: deepseek-service
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - KNOWLEDGE_DIR=/app/knowledge_data
    volumes:
      - ./knowledge_data:/app/knowledge_data
      - ./app:/app/app  # 挂载应用代码，便于开发调试
      - ./static:/app/static  # 新增：挂载前端文件
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # 添加热重载
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: deepseek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
